services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr_test
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    ports:
      - "8191:8191"

  tester:
    build:
      context: .
      dockerfile: Dockerfile.tester
    container_name: jobspy_tester
    depends_on:
      - flaresolverr
    environment:
      - PYTHONPATH=/app
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
