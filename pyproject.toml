[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "python-jobspy"
version = "1.3.0"
description = "JobSpy: job scraper for LinkedIn, Indeed, Glassdoor, ZipRecruiter, Bayt, Naukri, BDJobs & HelloWork"
authors = [
    { name = "Cullen Watson", email = "cullen@cullenwatson.com" },
    { name = "Zachary Hampton", email = "zachary@zacharysproducts.com" },
]
maintainers = [
    { name = "Kirk Watson", email = "kirk@klwindustries.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["jobs-scraper", "linkedin", "indeed", "glassdoor", "ziprecruiter", "bayt", "naukri", "bdjobs", "hellowork"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "pandas>=2.1.2",
    "pydantic>=2.3.0",
    "curl_cffi>=0.16.2",
    "markdownify>=1.1.0",
]
dynamic = ["classifiers"]

[project.urls]
Homepage = "https://github.com/speedyapply/JobSpy"
Issues = "https://github.com/speedyapply/JobSpy/issues"
"Release notes" = "https://github.com/speedyapply/JobSpy/releases"
Documentation = "https://github.com/speedyapply/JobSpy#readme"

[tool.poetry]
packages = [{ include = "jobspy" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
